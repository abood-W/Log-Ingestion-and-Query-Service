name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logs_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d logs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logs_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Start application
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 1
          done

          echo "Application failed to become healthy"
          cat server.log
          exit 1

      - name: Test log ingestion
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          response=$(curl --fail --silent \
            -X POST http://localhost:8080/logs \
            -H "Content-Type: application/json" \
            -d "{
              \"logs\": [
                {
                  \"timestamp\": \"$timestamp\",
                  \"level\": \"info\",
                  \"service\": \"ci-test\",
                  \"message\": \"CI ingestion test\",
                  \"attributes\": {
                    \"environment\": \"github-actions\"
                  }
                }
              ]
            }")

          echo "$response"
          echo "$response" | grep '"accepted":1'
          echo "$response" | grep '"rejected":\[\]'

      - name: Test log querying
        run: |
          response=$(curl --fail --silent \
            "http://localhost:8080/logs?limit=1")

          echo "$response"
          echo "$response" | grep '"service":"ci-test"'
          echo "$response" | grep '"next_cursor":null'

      - name: Show server logs on failure
        if: failure()
        run: cat server.log || true
