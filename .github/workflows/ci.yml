name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logs_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d logs_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logs_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Build TypeScript
        run: npm run build

      - name: Run TypeScript tests
        run: npm test
